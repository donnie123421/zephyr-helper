name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins a patch-level minimum (security fix); read it from
          # there so this doesn't silently drift behind.
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # gofmt has no exit code of its own — it just lists offenders.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # `go mod tidy` drift (direct imports still marked indirect) is easy to
      # miss locally and CLAUDE.md requires it before commit — enforce it.
      - name: go mod tidy is clean
        run: |
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null || ! diff -q go.sum go.sum.orig >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result"
            diff -u go.mod.orig go.mod || true
            exit 1
          fi
          rm go.mod.orig go.sum.orig

      - run: go vet ./...
      # The race detector is the whole point of running these in CI: the
      # store fans out to correlators, the notifier and every WS subscriber.
      - run: go test -race ./...
      - run: go build ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      # The action runs its own checkout and setup-go, so adding either here
      # just duplicates work. go-version-input must be blanked explicitly:
      # it defaults to 'stable', and setup-go ignores go-version-file whenever
      # go-version is also set — which silently scanned against a different
      # toolchain than the one go.mod pins for GO-2026-5856.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ''
          go-version-file: go.mod

  publish:
    name: Build & push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
